plugins {
    id 'com.android.application'
}

android {
    namespace 'ar.esqr.g75macro'
    compileSdk 35

    defaultConfig {
        applicationId 'ar.esqr.g75macro'
        minSdk 26
        // 28 a propósito: Android 10+ solo deja apagar/prender el WiFi (setWifiEnabled)
        // a las apps que apuntan a la API 28 o anterior. Sin esto no hay reinicio de WiFi sin root.
        targetSdk 28
        versionCode 2
        versionName '1.1'
    }

    // Firma fija: así cada versión nueva se instala encima de la anterior
    signingConfigs {
        fija {
            storeFile file("${rootDir}/firma.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.fija }
        release {
            signingConfig signingConfigs.fija
            minifyEnabled false
        }
    }

    // El targetSdk viejo es a propósito (ver arriba): que lint no frene la compilación por eso
    lint {
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi'
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
