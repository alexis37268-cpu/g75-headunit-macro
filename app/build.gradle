plugins {
    id 'com.android.application'
}

android {
    namespace 'ar.esqr.g75macro'
    compileSdk 35

    defaultConfig {
        applicationId 'ar.esqr.g75macro'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Firma fija: así cada versión nueva se instala encima de la anterior
    signingConfigs {
        fija {
            storeFile file("${rootDir}/firma.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.fija }
        release {
            signingConfig signingConfigs.fija
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
